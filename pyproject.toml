[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flipcheck"
version = "0.2.0"
description = "Measure how often a language model's answer changes when only the wording of the question changes"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Kishore Nuthalapati" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["llm", "robustness", "evaluation", "consistency", "uncertainty", "prompt sensitivity"]

[project.urls]
Homepage = "https://github.com/kishoren18-hue/flipcheck"
Issues = "https://github.com/kishoren18-hue/flipcheck/issues"
Changelog = "https://github.com/kishoren18-hue/flipcheck/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6", "pytest-cov>=5", "pre-commit>=3"]

[project.scripts]
flipcheck = "flipcheck.cli:main"

[tool.setuptools.package-data]
flipcheck = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E731", "E501"]  # long lines are mostly HTML templates

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"scripts/*" = ["E402"]
"examples/*" = ["E402"]
"benchmarks/*" = ["E402"]
